<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Offline | Lott mar komme</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#121212;color:#f7f3ea;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}.card{width:min(430px,100%);padding:34px;border:1px solid #5a4515;border-radius:24px;background:#1c1c1c}.mark{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 22px;border:2px solid #f5a900;border-radius:50%;color:#f5a900;font-weight:950;letter-spacing:.08em}h1{font-size:1.55rem}p{color:#aaa49a}button{border:0;border-radius:10px;padding:11px 16px;background:#f5a900;color:#15120a;font:inherit;font-weight:850;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">LMK</div>
    <h1>Keine Internetverbindung</h1>
    <p>Für Anmeldung und aktuelle Zugdaten wird eine Internetverbindung benötigt.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
